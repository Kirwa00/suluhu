name: Deploy

# Fires after CI finishes on main — never deploys an untested commit.
# Requires repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (see deploy/README.md).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/suluhu
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
            docker image prune -f

      - name: Verify the live site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-connrefused \
            https://api.suluhutherapy.co.ke/api/v1/health)
          if [ "$code" != "200" ]; then
            echo "Health check returned $code, expected 200"
            exit 1
          fi
          echo "Deployed and healthy."
